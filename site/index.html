<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7fb5e0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="הלו״ז האישי שלך ליום הגיבוש בים המלח, 15.10.2026" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./bg.webp" as="image" type="image/webp" />
    <title>יום גיבוש ים המלח | 15.10.2026</title>
    <script type="module" crossorigin src="./assets/main-D7GTiWMb.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-DjxHF4Qh.css">
  </head>
  <body>
    <main class="app">
      <section id="view-login" class="view view--login" hidden>
        <header class="hero">
          <p class="hero__date">יום חמישי | 15.10.2026</p>
          <h1 class="hero__title gradient-text">יום גיבוש</h1>
          <p class="hero__subtitle">ים המלח</p>
          <p class="hero__welcome">
            <strong class="hero__greeting">ברוכים הבאים!</strong>
            <span>שמש, מים מלוחים והמון כיף מחכים לכם.</span>
          </p>
        </header>
        <form id="login-form" class="card login" novalidate>
          <label for="user-id" class="login__label">5 ספרות אחרונות של הטלפון</label>
          <input
            id="user-id"
            name="id"
            class="login__input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="5"
            pattern="\d{5}"
            placeholder="•••••"
            dir="ltr"
            required
          />
          <p id="login-error" class="login__error" role="alert" aria-live="polite"></p>
          <button id="login-submit" class="button button--primary login__submit" type="submit">לצפייה בלו״ז שלי</button>
        </form>
      </section>

      <section id="view-schedule" class="view view--schedule" hidden>
        <header class="topbar card">
          <div class="topbar__text">
            <h1 class="topbar__title gradient-text">הלו״ז שלי</h1>
            <p class="topbar__meta"><span>יום גיבוש ים המלח</span> <span>15.10.2026</span></p>
          </div>
          <div class="topbar__actions">
            <span class="topbar__id">טלפון <bdi class="topbar__digits" dir="ltr">•••<span id="schedule-id"></span></bdi></span>
            <button id="logout" class="button button--ghost" type="button">החלפת משתמש</button>
          </div>
        </header>
        <p id="schedule-notice" class="notice" role="status" hidden></p>
        <ol id="schedule-list" class="timeline"></ol>
      </section>

      <p id="loading" class="loading" hidden>טוען...</p>
    </main>
  </body>
</html>
